name: Build iOS App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Shared KMP Framework for iOS
        run: ./gradlew :shared:linkReleaseFrameworkIosArm64

      - name: Build iOS App (.app)
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package .ipa Payload
        run: |
          mkdir -p build/Payload
          cp -r build/ios/Build/Products/Release-iphoneos/iosApp.app build/Payload/
          cd build && zip -r IbraMusic-iOS.ipa Payload/
          cd ..

      - name: Upload iOS App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IbraMusic-iOS-ipa
          path: build/IbraMusic-iOS.ipa
          retention-days: 14

